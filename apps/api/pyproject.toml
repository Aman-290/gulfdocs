[project]
name = "gulfdocs-api"
version = "0.1.0"
description = "Public FastAPI service for GulfDocs"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16.4,<2",
  "fastapi>=0.116.1,<1",
  "firebase-admin>=7.1.0,<8",
  "google-auth>=2.40.3,<3",
  "google-cloud-storage>=3.2.0,<4",
  "google-cloud-tasks>=2.19.3,<3",
  "gulfdocs-document-intelligence",
  "gulfdocs-persistence",
  "opentelemetry-api>=1.36.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "pgvector>=0.4.1,<1",
  "psycopg[binary,pool]>=3.2.9,<4",
  "pydantic-settings>=2.10.1,<3",
  "sqlalchemy>=2.0.42,<3",
  "structlog>=25.4.0,<26",
  "uvicorn[standard]>=0.35.0,<1",
]

[tool.uv.sources]
gulfdocs-document-intelligence = { workspace = true }
gulfdocs-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gulfdocs_api"]
