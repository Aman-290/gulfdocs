[project]
name = "gulfdocs-worker"
version = "0.1.0"
description = "Private document-processing worker for GulfDocs"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.1,<1",
  "google-auth>=2.40.3,<3",
  "google-cloud-storage>=3.2.0,<4",
  "gulfdocs-document-intelligence",
  "gulfdocs-persistence",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-sdk>=1.36.0,<2",
  "pydantic-settings>=2.10.1,<3",
  "structlog>=25.4.0,<26",
  "uvicorn[standard]>=0.35.0,<1",
]

[tool.uv.sources]
gulfdocs-document-intelligence = { workspace = true }
gulfdocs-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gulfdocs_worker"]
