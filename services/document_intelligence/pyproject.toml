[project]
name = "gulfdocs-document-intelligence"
version = "0.1.0"
description = "Provider-neutral GulfDocs document intelligence domain"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-genai>=1.29.0,<2",
  "langgraph>=0.6.4,<1",
  "pydantic>=2.11.7,<3",
  "pymupdf>=1.26.3,<2",
  "tenacity>=9.1.2,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gulfdocs_document_intelligence"]
