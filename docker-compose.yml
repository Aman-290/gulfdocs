services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: gulfdocs
      POSTGRES_USER: gulfdocs
      POSTGRES_PASSWORD: gulfdocs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulfdocs -d gulfdocs"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gulfdocs-postgres:/var/lib/postgresql/data

volumes:
  gulfdocs-postgres:
