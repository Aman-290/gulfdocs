[project]
name = "gulfdocs-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "services/document_intelligence",
  "services/persistence",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.16.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
markers = [
  "integration: requires the local PostgreSQL service and migrated schema",
]
testpaths = [
  "evaluation/tests",
  "apps/api/tests",
  "apps/worker/tests",
  "services/document_intelligence/tests",
  "services/persistence/tests",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fitz.*", "firebase_admin"]
ignore_missing_imports = true
